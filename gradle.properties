mod_description=Datapack JSON rules for modpack makers: pick mobs by where, when and how they spawn, then change their attributes (any attribute, scaling with day, distance and difficulty), gear (weighted loadouts, enchants, drop chances, trims, dyes), effects, flags, riders, combat (damage taken and dealt by type, on-hit effects, lifesteal, thorns, regen), targeting, griefing, drops, XP and boss bars. Inspired by In Control by McJty. Designed by Kragnoth, coded with AI help.
